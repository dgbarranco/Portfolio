<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Received — Drew Barranco Landa</title>
<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
.confirmation-page{flex:1;display:grid;place-items:center;padding:40px 20px}
.confirmation-card{width:min(620px,100%);background:#FFF7C7;border:1px solid #111;border-radius:28px;padding:clamp(30px,6vw,70px);box-sizing:border-box}
.confirmation-label{font-family:"DM Mono",monospace;font-size:12px;letter-spacing:.08em;margin-bottom:28px}
h1{font-family:"Unbounded",sans-serif;font-size:clamp(34px,6vw,68px);line-height:1;letter-spacing:-.06em;margin:0 0 25px}
p,#meeting-details{font-family:"DM Mono",monospace;font-size:13px;line-height:1.8}
#meeting-details{border-top:1px solid rgba(0,0,0,.3);border-bottom:1px solid rgba(0,0,0,.3);padding:20px 0;margin:25px 0}
.home-button{display:inline-block;border:1px solid #111;border-radius:8px;background:#111;color:#FFF7C7;padding:14px 18px;text-decoration:none;font-family:"DM Mono",monospace;font-size:12px}
.home-button:hover{background:transparent;color:#111}
</style>
</head>
<body>
<main class="confirmation-page"><section class="confirmation-card" aria-live="polite">
<div class="confirmation-label">07 / REQUEST STATUS</div>
<h1>REQUEST<br>RECEIVED.</h1>
<p>Your meeting request has been submitted for Drew's approval.</p>
<div id="meeting-details">Loading your request details...</div>
<p>If approved, you will receive a Google Calendar invitation at the email address you provided.</p>
<a class="home-button" href="calendar.html">BACK TO CALENDAR →</a>
</section></main>
<script>
const params=new URLSearchParams(window.location.search);
const name=params.get("name")||"there";
const date=params.get("date")||"your selected date";
const time=params.get("time")||"your selected time";
const duration=params.get("duration")||"";
document.getElementById("meeting-details").textContent=`Thank you, ${name}. Your request is for ${date} at ${time}${duration ? ` for ${duration} minutes` : ""}.`;
</script>
</body>
</html>
